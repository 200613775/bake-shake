<!DOCTYPE html>

<head>

<title>Bake &amp; Shake | Bubble tea, shakes and desserts in Barrie, Ontario</title>
<meta name="description" content="Bubble tea, slushes, smoothies, shakes, croffles and chocolate strawberries at two Barrie locations: Mapleview Drive and Cundles Road East.">

<header class="site-header">
  <div class="wrap row">
    <a class="brand" href="#top" id="siteName"></a>
    <nav aria-label="Main">
      <a href="#menu">Menu</a>
      <a href="#locations">Locations</a>
      <a href="#follow">Follow us</a>
      <a class="nav-btn" href="#order" id="navOrder">Order online</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero confetti">
    <div class="hero-bg" id="heroBg"></div>
    <div class="wrap hero-inner">
      <h1 id="heroTitle"></h1>
      <p id="heroText"></p>
      <p class="hero-actions">
        <a class="btn" href="#locations">Menu and locations</a>
        <a class="btn light" id="heroOrder" href="#order">Order online</a>
      </p>
    </div>
    <svg class="fl f1" aria-hidden="true"><use href="#i-cup"/></svg>
    <svg class="fl f2" aria-hidden="true"><use href="#i-berry"/></svg>
    <svg class="fl f3" aria-hidden="true"><use href="#i-glass"/></svg>
    <svg class="fl f4" aria-hidden="true"><use href="#i-cake"/></svg>
    <svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 34C240 74 480 4 720 34s480 36 720-4v30H0z"/></svg>
  </section>

  <div class="wrap" id="stories"></div>

  <div class="wrap">
    <section id="loved">
      <h2 class="section-title">Customer favourites</h2>
      <div class="loved" id="lovedList"></div>
    </section>
  </div>

  <div class="wrap photos" id="photos" hidden></div>


  <div class="wrap">
    <section id="menu">
      <h2 class="section-title">Menu</h2>
      <p class="lead">Tap a category to see every flavour.</p>
      <div class="tiles" id="menuList"></div>
      <p class="menu-foot" id="menuFoot"></p>
    </section>

    <section id="locations">
      <h2 class="section-title">Find a shop</h2>
      <div class="locs" id="locList"></div>
      <div class="order" id="order">
        <p class="order-label">Can't make it in? Order for delivery or pickup:</p>
        <p id="orderButtons"></p>
      </div>
    </section>
  </div>

</main>

<footer class="confetti">
  <div class="wrap foot-grid">
    <div>
      <p class="foot-brand" id="footBrand"></p>
      <p>Bubble tea, shakes and desserts in Barrie, Ontario.</p>
    </div>
    <div>
      <p class="foot-head">Explore</p>
      <p><a href="#menu">Menu</a></p>
      <p><a href="#locations">Locations</a></p>
      <p><a href="#order">Order online</a></p>
    </div>
    <div>
      <p class="foot-head">Follow</p>
      <p id="social"></p>
    </div>
  </div>
  <div class="wrap"><p class="copy" id="copyright"></p></div>
</footer>


<dialog class="sheet" id="menuDialog" aria-labelledby="sheetTitle">
  <div class="sheet-top">
    <div class="sheet-tabs" id="sheetTabs"></div>
    <button class="close" id="sheetClose" type="button" aria-label="Close menu">&times;</button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="cat-head" id="sheetHead">
      <span id="sheetIcon"></span>
      <div><h3 id="sheetTitle"></h3><p class="note" id="sheetNote"></p></div>
    </div>
    <div class="cards" id="sheetCards"></div>
    <p class="menu-foot" id="sheetFoot"></p>
  </div>
</dialog>

<!-- content.js must load BEFORE script.js -->
<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
